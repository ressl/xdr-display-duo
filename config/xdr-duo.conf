# XDR Display Duo: the single place that names the two displays and the aggregate.
# Installed to ~/Library/Application Support/xdr-duo/xdr-duo.conf.
# Sourced by the shell scripts and parsed by the Swift tools, which read the values
# literally: keep plain KEY="value" lines; only TOOLS_DIR may use shell expansion.
#
# install.sh fills in the two UIDs when exactly two displays are attached. Otherwise list
# them with `xdr-volume list --xdr` (or `build/xdr-volume list --xdr`) and paste them here.
# XDR 1 is the clock reference; XDR 2 is drift-compensated.

XDR1_UID="REPLACE_WITH_XDR1_UID"
XDR2_UID="REPLACE_WITH_XDR2_UID"
AGG_UID="com.ressl.xdr-duo"
AGG_NAME="XDR Display Duo"

# Where install.sh puts the binaries and tests (shell scripts only).
TOOLS_DIR="$HOME/Library/Application Support/xdr-duo/bin"
